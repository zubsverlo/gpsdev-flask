upstream gpsdev {
    server flask:5000;
}
upstream gpsdev_dev {
    server 172.17.0.1:5001;
}

server {
    listen 80;

    server_name gpsdev.ru www.gpsdev.ru;

    return 301 https://$host$request_uri;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/ssl/live/gpsdev.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/gpsdev.ru/privkey.pem;

    server_name gpsdev.ru www.gpsdev.ru;
    location / {
        proxy_pass http://gpsdev/;
        proxy_redirect     off;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
        
    location /static {
       alias /app/gpsdev_flask/static;
	}

}

server {
        listen 80;
        server_name d.gpsdev.ru www.d.gpsdev.ru;
        location / {
            proxy_pass http://gpsdev_dev/;
            proxy_redirect     off;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
}
