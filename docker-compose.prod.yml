version: "3.5"
services:
  background:
    build:
      context: .
      dockerfile: Dockerfile-background-executor
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always
    environment:
      - ENV=production
      - TZ=Europe/Moscow

  redis:
    image: redis:7.4-alpine
    restart: always
    environment:
      - TZ=Europe/Moscow
    # ports:
    #   - "6378:6379"

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - ENV=production
      - TZ=Europe/Moscow
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 -w 9 run:app

  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    restart: always
    environment:
      - ENV=production
      - TZ=Europe/Moscow
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      - flask

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  celery:
    build:
      context: .
      dockerfile: Dockerfile-celery
    depends_on:
      - redis
    environment:
      - ENV=production
      - TZ=Europe/Moscow
    restart: always
    volumes:
      - .:/app
    entrypoint: celery
    command: -A gpsdev_flask.celery_app.app_celery worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile-celery
    depends_on:
      - redis
    environment:
      - ENV=production
      - TZ=Europe/Moscow
    restart: always
    volumes:
      - .:/app
    entrypoint: celery
    command: -A gpsdev_flask.celery_app beat -l info
